services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-resume-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/resume_analyzer.db:/app/backend/resume_analyzer.db
      - ./uploads:/app/uploads
      - ./chroma_db:/app/chroma_db
      - ./knowledge_base:/app/knowledge_base
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: ai-resume-frontend
    ports:
      - "5500:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped
